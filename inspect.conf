# inspect.conf：所有中间件的默认运行参数；每行格式为 参数名 = 值1|值2|...
# Linux 上首次运行会自动收紧为 700 权限；账号密码仍由 inventory/hosts*.ini 管理。

# Nginx 可执行文件候选路径；进程参数无法解析时按顺序查找可执行文件。
nginx_bin = /usr/sbin/nginx|/opt/nginx/sbin/nginx|/opt/nginx-aqwh/sbin/nginx|/usr/local/nginx/sbin/nginx

# Nginx 主配置文件候选路径；进程没有 -c 参数时按顺序查找存在的文件。
nginx_conf = /opt/nginx-aqwh/conf/nginx.conf|/opt/nginx/conf/nginx.conf|/usr/local/nginx/conf/nginx.conf

# Nginx 错误日志候选路径；进程没有 -e 参数且配置未声明 error_log 时按顺序查找。
nginx_error_log = /opt/nginx-aqwh/logs/error.log|/opt/nginx/logs/error.log|/usr/local/nginx/logs/error.log

# Nginx 访问日志候选路径；优先从实际配置中的 access_log 指令解析，解析不到时查找这些路径。
nginx_access_log = /opt/nginx-aqwh/logs/access.log|/opt/nginx/logs/access.log|/usr/local/nginx/logs/access.log

# Nginx 监听端口候选值；优先从实际 nginx 配置的 listen 指令解析，仅作无法解析时的备用值。
nginx_port = 8010

# Nginx 版本基线；从运行中的 Nginx master 对应可执行文件执行 -v 取得实际版本，支持多个允许版本。
nginx_version = nginx/1.28.0

# Nginx 安全基线键值；格式为 检查项=True/False，多个检查项用 | 分隔。
nginx_baseline = "server_tokens_off=True"|"autoindex_off=True"

# Nginx 白名单 IP；白名单主机未发现 Nginx 进程时标记 CRIT，其他主机跳过 Nginx 指标。
nginx_whitelist = 192.0.2.10|192.0.2.11

# Keepalived 可执行文件候选路径；运行进程参数无法解析时按顺序查找。
keepalived_bin = /usr/sbin/keepalived|/usr/local/sbin/keepalived|/opt/keepalived/sbin/keepalived

# Keepalived 主配置文件候选路径；运行进程没有 -f 参数时按顺序查找。
keepalived_conf = /opt/keepalived/conf/keepalived.conf|/etc/keepalived/keepalived.conf|/usr/local/etc/keepalived/keepalived.conf

# Keepalived 日志文件候选路径；Keepalived 常通过 syslog 输出，无法从进程/rsyslog 发现时使用这些路径。
keepalived_log = /opt/keepalived/logs/keepalived.log|/var/log/keepalived.log

# Keepalived VIP 候选值；优先从运行配置 virtual_ipaddress 读取，仅作兜底。
keepalived_vip = 192.0.2.253

# VIP 访问端口；Keepalived 本身不监听 HTTP，默认用于验证 VIP 后面的 Nginx/业务入口。
keepalived_port = 8010

# Keepalived 版本基线；从运行中 Keepalived 对应二进制执行 -v 获取实际版本。
keepalived_version = keepalived/2.2.8

# Keepalived 配置基线键值；当前由配置基线解析器检查固定关键项，后续可扩展参数化规则。
keepalived_baseline = state=True|interface=True|virtual_router_id=True|priority=True|advert_int=True|virtual_ipaddress=True|script=True|track_script=True

# Keepalived 白名单 IP；白名单主机未发现 Keepalived 进程时标记 CRIT，其他主机跳过 Keepalived 指标。
keepalived_whitelist = 192.0.2.10|192.0.2.11

# Elasticsearch 可执行文件候选路径；优先从运行进程 -Des.path.home 或实际命令路径发现，未发现时按顺序兜底。
elasticsearch_bin = /opt/elasticsearch/bin/elasticsearch|/usr/local/elasticsearch/bin/elasticsearch|/usr/share/elasticsearch/bin/elasticsearch

# Elasticsearch 配置文件候选路径；优先从 -Des.path.conf/运行目录发现，未发现时按顺序兜底。
elasticsearch_conf = /opt/elasticsearch/config/elasticsearch.yml|/etc/elasticsearch/elasticsearch.yml|/usr/local/etc/elasticsearch/elasticsearch.yml

# Elasticsearch 主日志候选路径；优先从 -Des.path.logs 与 path.logs 发现。
elasticsearch_log = /opt/elasticsearch/logs/es-prod-cluster.log|/opt/elasticsearch/logs/elasticsearch.log|/var/log/elasticsearch/elasticsearch.log

# Elasticsearch GC 日志候选路径；用于检查 Full GC、Pause、OutOfMemory。
elasticsearch_gc_log = /opt/elasticsearch/logs/gc.log|/opt/elasticsearch/logs/gc.log.*|/var/log/elasticsearch/gc.log

# Elasticsearch 数据目录候选路径；用于磁盘巡检说明和路径兜底。
elasticsearch_data = /opt/elasticsearch/data|/var/lib/elasticsearch

# Elasticsearch 备份目录候选路径；用于磁盘巡检说明。
elasticsearch_backup = /opt/elasticsearch/backup|/var/backups/elasticsearch

# Elasticsearch HTTP API 地址；优先从运行配置 network.host/http.port 推导，未发现时按顺序使用。
elasticsearch_endpoint = https://127.0.0.1:9200

# Elasticsearch HTTP API 端口；优先从 elasticsearch.yml http.port 推导，仅作兜底。
elasticsearch_http_port = 9200

# Elasticsearch 节点传输端口；优先从 elasticsearch.yml transport.port 推导，仅作兜底。
elasticsearch_transport_port = 9300

# Elasticsearch 版本基线；从运行中的 Elasticsearch 对应二进制 --version 取得实际版本。
elasticsearch_version = 8.17.0

# 期望的集群节点数；用于集群健康和 _cat/nodes 在线节点数判定。
elasticsearch_expected_nodes = 3

# 集群发现 seed_hosts；用于 discovery 配置检查，多个节点用 | 分隔。
elasticsearch_seed_hosts = 192.0.2.101:9300|192.0.2.102:9300|192.0.2.103:9300

# Elasticsearch 运行系统用户；用于读取该用户 ulimit，通常为 es。
elasticsearch_system_user = es

# 可选的目标主机 curl netrc 文件候选路径；不在此文件写用户名/密码，缺少该文件时 API 认证失败会是 UNKNOWN。
elasticsearch_auth_file = /opt/elasticsearch/.inspect-netrc|/home/es/.config/inspect-es.netrc

# HTTPS CA 证书候选路径；openssl 只读检查有效期，路径优先从 elasticsearch.yml/运行参数发现。
elasticsearch_cert = /opt/elasticsearch/config/certs/http_ca.crt|/etc/elasticsearch/certs/http_ca.crt

# 快照仓库名称；用于 /_snapshot/<repo>/_verify，未配置时该指标 UNKNOWN。
elasticsearch_snapshot_repo = backup

# Elasticsearch 白名单 IP；白名单主机未发现 ES 进程时标记 CRIT，其他主机跳过 ES 指标。
elasticsearch_whitelist = 192.0.2.101|192.0.2.102|192.0.2.103
