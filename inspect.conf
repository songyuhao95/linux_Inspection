# inspect.conf：所有中间件的默认运行参数；每行格式为 参数名 = 值1|值2|...
# Linux 上首次运行会自动收紧为 700 权限；Ansible SSH 账号密码仍由
# inventory/hosts*.ini 管理，Elasticsearch HTTP API 账号密码见 ES 配置段。

# 全局超时时间（秒）；SSH 连接、能力探测、shell 命令和 curl 请求均不超过此值。
# 超时的指标不伪造结论，统一标记为 UNKNOWN。
timeout = 3

# Nginx 可执行文件候选路径；进程参数无法解析时按顺序查找可执行文件。
nginx_bin = /usr/sbin/nginx|/opt/nginx/sbin/nginx|/opt/nginx-aqwh/sbin/nginx

# Nginx 主配置文件候选路径；进程没有 -c 参数时按顺序查找存在的文件。
nginx_conf = /opt/nginx/conf/|/opt/nginx-aqwh/conf/

# Nginx 错误日志候选路径；进程没有 -e 参数且配置未声明 error_log 时按顺序查找。
nginx_log = /opt/nginx/logs/|/opt/nginx-aqwh/logs/
# Nginx 错误日志文件候选路径；用于统计错误日志数量。
nginx_error_log = /opt/nginx/logs/error.log|/opt/nginx-aqwh/logs/error.log

# Nginx 访问日志候选路径；优先从实际配置中的 access_log 指令解析，解析不到时查找这些路径。
nginx_access_log = /opt/nginx/logs/access.log|/opt/nginx-aqwh/logs/access.log

# Nginx 监听端口候选值；优先从实际 nginx 配置的 listen 指令解析，仅作无法解析时的备用值。
nginx_port = 8010

# Nginx 版本基线；从运行中的 Nginx master 对应可执行文件执行 -v 取得实际版本，支持多个允许版本。
nginx_version = nginx/1.28.0

# Nginx 安全基线键值；格式为 检查项=True/False，多个检查项用 | 分隔。
nginx_baseline = "server_tokens_off=True"|"autoindex_off=True"

# Nginx 白名单 IP；白名单主机未发现 Nginx 进程时标记 CRIT，其他主机跳过 Nginx 指标。
nginx_whitelist = 192.0.2.10|192.0.2.11

# Keepalived 可执行文件候选路径；运行进程参数无法解析时按顺序查找。
keepalived_bin = /usr/sbin/keepalived

# Keepalived 主配置文件候选路径；运行进程没有 -f 参数时按顺序查找。
keepalived_conf = /opt/keepalived/conf/

# Keepalived 日志文件候选路径；Keepalived 常通过 syslog 输出，无法从进程/rsyslog 发现时使用这些路径。
keepalived_log = /opt/keepalived/logs/
# Keepalived 健康检查脚本路径；用于检查 track_script 引用的脚本是否存在。
keepalived_healthcheck_script = /etc/keepalived/check.sh

# Keepalived VIP 候选值；优先从运行配置 virtual_ipaddress 读取，仅作兜底。
keepalived_vip = 192.0.2.253

# VIP 访问端口；Keepalived 本身不监听 HTTP，默认用于验证 VIP 后面的 Nginx/业务入口。
keepalived_port = 8010

# Keepalived 版本基线；从运行中 Keepalived 对应二进制执行 -v 获取实际版本。
keepalived_version = keepalived/2.2.8

# Keepalived 配置基线键值；当前由配置基线解析器检查固定关键项，后续可扩展参数化规则。
keepalived_baseline = state=True|interface=True|virtual_router_id=True|priority=True|advert_int=True|virtual_ipaddress=True|script=True|track_script=True

# Keepalived 白名单 IP；白名单主机未发现 Keepalived 进程时标记 CRIT，其他主机跳过 Keepalived 指标。
keepalived_whitelist = 192.0.2.10|192.0.2.11

# Elasticsearch 可执行文件候选路径；优先从运行进程 -Des.path.home 或实际命令路径发现，未发现时按顺序兜底。
elasticsearch_bin = /opt/elasticsearch/bin/elasticsearch|/usr/local/elasticsearch/bin/elasticsearch|/usr/share/elasticsearch/bin/elasticsearch

# Elasticsearch 配置文件候选路径；优先从 -Des.path.conf/运行目录发现，未发现时按顺序兜底。
elasticsearch_conf = /opt/elasticsearch/conf/elasticsearch.yml|/opt/elasticsearch/config/elasticsearch.yml|/etc/elasticsearch/elasticsearch.yml|/usr/local/etc/elasticsearch/elasticsearch.yml

# Elasticsearch 主日志候选路径；优先从 -Des.path.logs 与 path.logs 发现。
elasticsearch_log = /opt/elasticsearch/logs/es-prod-cluster.log|/opt/elasticsearch/logs/elasticsearch.log|/var/log/elasticsearch/elasticsearch.log

# Elasticsearch GC 日志候选路径；用于检查 Full GC、Pause、OutOfMemory。
elasticsearch_gc_log = /opt/elasticsearch/logs/gc.log|/opt/elasticsearch/logs/gc.log.*|/var/log/elasticsearch/gc.log

# Elasticsearch 数据目录候选路径；用于磁盘巡检说明和路径兜底。
elasticsearch_data = /opt/elasticsearch/data|/var/lib/elasticsearch

# Elasticsearch 备份目录候选路径；用于磁盘巡检说明。
elasticsearch_backup = /opt/elasticsearch/backup|/var/backups/elasticsearch

  # Elasticsearch HTTP API 兼容地址；实际 curl 优先使用运行中 elasticsearch.yml
  # 的 http.host/http.bind_host/network.bind_host/network.host 监听地址；此参数仅在
  # 运行配置无法解析具体监听地址时作为候选参考，端口仍以运行配置或 elasticsearch_http_port 为准。
elasticsearch_endpoint = https://127.0.0.1:9200

# Elasticsearch HTTP API 端口；优先从 elasticsearch.yml http.port 推导，仅作兜底。
elasticsearch_http_port = 9200

# Elasticsearch 节点传输端口；优先从 elasticsearch.yml transport.port 推导，仅作兜底。
elasticsearch_transport_port = 9300

# Elasticsearch 版本基线；从运行实例发现的根 API version.number 取得实际版本。
elasticsearch_version = 8.17.0

# 期望的集群节点数；用于集群健康和 _cat/nodes 在线节点数判定。
elasticsearch_expected_nodes = 3

# 集群发现 seed_hosts；用于 discovery 配置检查，多个节点用 | 分隔。
elasticsearch_seed_hosts = 192.0.2.101:9300|192.0.2.102:9300|192.0.2.103:9300

# Elasticsearch 运行系统用户；用于读取该用户 ulimit，通常为 es。
elasticsearch_system_user = es

# 可选的目标主机 curl netrc 文件候选路径；当 API 用户名/密码未配置时作为认证兜底。
elasticsearch_auth_file = /opt/elasticsearch/.inspect-netrc|/home/es/.config/inspect-es.netrc

# Elasticsearch HTTP API 用户名；请在目标环境的私有 inspect.conf 中填写，勿提交真实凭据。
elasticsearch_api_user = elastic

# Elasticsearch HTTP API 密码；CHANGE_ME 只是 GitHub 脱敏模板，占位值不会启用认证。
elasticsearch_api_password = CHANGE_ME

# Elasticsearch HTTPS CA 证书候选路径；API curl 优先使用 --cacert，路径优先从运行配置发现。
elasticsearch_cacert = /opt/elasticsearch/conf/certs/http_ca.crt|/opt/elasticsearch/config/certs/http_ca.crt|/etc/elasticsearch/certs/http_ca.crt

# HTTPS 证书候选路径；openssl 只读检查有效期，且作为 elasticsearch_cacert 的兜底。
elasticsearch_cert = /opt/elasticsearch/conf/certs/http_ca.crt|/opt/elasticsearch/config/certs/http_ca.crt|/etc/elasticsearch/certs/http_ca.crt

# 快照仓库名称；用于 /_snapshot/<repo>/_verify，未配置时该指标 UNKNOWN。
elasticsearch_snapshot_repo = backup

# Elasticsearch 白名单 IP；白名单主机未发现 ES 进程时标记 CRIT，其他主机跳过 ES 指标。
elasticsearch_whitelist = 192.0.2.101|192.0.2.102|192.0.2.103

# Kafka/Zookeeper：默认值来自 Kafka+Zookeeper 运维巡检手册 v1.0；候选值可在现场私有配置中覆盖。
# Kafka 启动脚本候选路径；用于识别 Kafka 安装位置和执行只读管理命令。
kafka_bin = /opt/kafka/bin/kafka-server-start.sh
# Kafka 主配置文件路径；用于读取监听器、副本和安全配置。
kafka_conf = /opt/kafka/conf/server.properties
# Kafka 日志目录；用于统计关键错误和日志留存情况。
kafka_log = /opt/kafka/logs/
# ZooKeeper 启动程序候选路径；用于识别 ZooKeeper 安装位置。
zookeeper_bin = /opt/redis/bin/redis-server
# ZooKeeper 主配置文件路径；用于读取客户端端口、数据目录和集群配置。
zookeeper_conf = /opt/zookeeper/conf/zoo.cfg
# ZooKeeper 日志目录；用于检查关键错误和日志留存。
zookeeper_log = /opt/zookeeper/logs
# ZooKeeper 数据目录；用于检查数据目录是否存在及留存情况。
zookeeper_data = /opt/zookeeper/data
# ZooKeeper 事务日志目录；用于检查事务日志目录是否存在及留存情况。
zookeeper_datalog = /opt/zookeeper/datalog
# Kafka 使用的 ZooKeeper 配置文件路径；用于读取 Kafka 依赖的 ZooKeeper 参数。
kafka_zookeeper_conf = /opt/zookeeper/conf/zoo.cfg
# Kafka 连接 ZooKeeper 的地址；优先从 Kafka 配置提取，此值作为兜底。
kafka_zookeeper_connect = 127.0.0.1:2181
# Kafka Broker 地址；优先从 Kafka 配置提取，此值作为兜底。
kafka_bootstrap = 127.0.0.1:9093
# Kafka 客户端 SSL 配置文件；存在时用于只读管理命令的 TLS 连接。
kafka_ssl_config = /opt/kafka/conf/client-ssl.properties
# Kafka Broker 客户端监听端口；用于端口健康检查和连接兜底。
kafka_port = 9093
# ZooKeeper 客户端服务端口；用于 ruok、stat、mntr 等只读检查。
kafka_zookeeper_port = 2181
# ZooKeeper 客户端端口；用于检查 ZooKeeper 核心端口。
zookeeper_client_port = 2181
# ZooKeeper 节点间通信端口；用于检查集群通信端口。
zookeeper_peer_port = 2888
# ZooKeeper 选举端口；用于检查集群选举通信端口。
zookeeper_election_port = 3888

# MySQL：默认值来自 Mysql 运维巡检手册 v1.0。
# MySQL 客户端程序路径；用于执行只读 SQL 巡检命令。
mysql_bin = /opt/mysql/bin/mysql
# MySQL 主配置文件路径；用于检查配置基线。
mysql_conf = /opt/mysql/conf/my.cnf
# MySQL Unix socket 文件路径；优先使用本地 socket 连接数据库。
mysql_socket = /opt/mysql/tmp/mysql.sock
# MySQL 日志目录；用于查找错误日志、慢日志和日志留存文件。
mysql_log = /opt/mysql/logs
# MySQL 错误日志文件路径；用于统计关键错误。
mysql_error_log = /opt/mysql/logs/error.log
# MySQL 慢查询日志文件路径；用于统计慢查询证据。
mysql_slow_log = /opt/mysql/logs/slow.log
# MySQL 数据目录；用于检查数据目录和磁盘使用情况。
mysql_data = /opt/mysql/data
# MySQL Binlog 目录；用于检查 Binlog 留存和文件增长。
mysql_binlog = /opt/mysql/binlog
# MySQL Relay Log 目录；用于检查复制日志留存。
mysql_relaylog = /opt/mysql/relaylog
# MySQL 备份目录；用于检查备份文件留存情况。
mysql_backup = /opt/mysql/backuptest
# MySQL 服务端口；在无法从运行配置提取时作为连接兜底。
mysql_port = 3306
# MySQL 巡检账户名；仅用于执行授权范围内的只读 SQL。
mysql_user = Mysql_inspect
# MySQL 巡检账户密码；请在现场私有配置中填写，勿提交真实密码。
mysql_passwd = CHANGE_ME
# MySQL 连接地址；优先使用 Unix socket，此值用于 TCP 连接兜底。
mysql_host = 127.0.0.1

# Nacos：默认值来自 Nacos 运维巡检手册 v1.0。
# Nacos 安装主目录；用于派生配置、日志、数据和启动路径。
nacos_home = /opt/nacos
# Nacos 启动脚本路径；用于识别安装位置和启动参数。
nacos_bin = /opt/nacos/bin/startup.sh
# Nacos 主配置文件路径；用于检查端口、节点身份和数据库配置。
nacos_conf = /opt/nacos/conf/application.properties
# Nacos 集群节点配置文件路径；用于检查集群节点数量和地址。
nacos_cluster_conf = /opt/nacos/conf/cluster.conf
# Nacos 数据目录；用于检查数据目录是否存在及留存情况。
nacos_data = /opt/nacos/data
# Nacos HTTP 地址；优先从运行配置发现，此值作为健康检查兜底。
nacos_endpoint = http://127.0.0.1:8848
# Nacos HTTP 服务端口；用于 HTTP 健康检查和端口检查。
nacos_http_port = 8848
# Nacos gRPC 服务端口；用于检查客户端 gRPC 端口。
nacos_grpc_port = 9848
# Nacos gRPC 集群端口偏移；用于推导节点间 gRPC 端口。
nacos_grpc_port_offset = 9849
# Nacos Raft 端口；用于检查集群选举通信端口。
nacos_raft_port = 7848
# Nacos 日志目录；用于统计错误日志和日志留存。
nacos_log = /opt/nacos/logs
# 期望的 Nacos 集群节点数；用于集群节点数量判定。
nacos_expected_nodes = 3
# Nacos 登录用户名；用于登录 HTTP API 获取集群信息。
nacos_user = nacos
# Nacos 登录密码；请在现场私有配置中填写，勿提交真实密码。
nacos_passwd = CHANGE_ME

# RabbitMQ：默认值来自 Rabbitmq 运维巡检手册 v1.0。
# RabbitMQ 安装主目录；用于派生运行、配置和数据路径。
rabbitmq_home = /opt/rabbitmq
# RabbitMQ 主配置文件路径；用于检查配置基线。
rabbitmq_conf = /opt/rabbitmq/conf/rabbitmq.conf
# RabbitMQ 服务程序路径；用于识别安装位置和运行程序。
rabbitmq_bin = /opt/rabbitmq/sbin/rabbitmq-server
# RabbitMQ 环境配置文件路径；用于检查环境参数。
rabbitmq_env_conf = /opt/rabbitmq/conf/rabbitmq-env.conf
# RabbitMQ 日志目录；用于统计关键错误和日志留存。
rabbitmq_log = /opt/rabbitmq/logs
# RabbitMQ 数据目录；用于检查数据留存和磁盘情况。
rabbitmq_data = /opt/rabbitmq/data/mnesia
# RabbitMQ 运行目录；用于检查 PID、节点和运行时文件。
rabbitmq_run = /opt/rabbitmq/run
# RabbitMQ Erlang Cookie 文件路径；用于检查集群节点身份一致性。
rabbitmq_cookie = /home/rabbitmq/.erlang.cookie
# RabbitMQ 运行用户；用于检查进程和文件归属。
rabbitmq_user = rabbitmq
# RabbitMQ systemd 服务单元名；用于检查服务定义和自启动状态。
rabbitmq_unit = rabbitmq
# 期望的 RabbitMQ 集群节点数；用于集群节点健康判定。
rabbitmq_expected_nodes = 3
# RabbitMQ AMQP 服务端口；用于核心端口检查。
rabbitmq_port = 5672
# RabbitMQ Management API 端口；用于管理接口端口检查。
rabbitmq_management_port = 15672
# RabbitMQ 集群通信端口；用于节点间通信端口检查。
rabbitmq_cluster_port = 25672
# RabbitMQ EPMD 端口；用于 Erlang 节点发现端口检查。
rabbitmq_epmd_port = 4369

# Redis：默认值来自 Redis 运维巡检手册 v1.0。
# Redis 安装主目录；用于派生程序、配置、日志和数据路径。
redis_home = /opt/redis
# Redis 服务程序路径；用于识别运行进程和派生 redis-cli 路径。
redis_bin = /opt/redis/bin/redis-server
# Redis 配置文件或配置目录；用于检查配置基线和运行模式。
redis_conf = /opt/redis/conf
# Redis 日志目录；用于统计关键错误和日志留存。
redis_log = /opt/redis/logs
# Redis 数据目录；用于检查数据文件留存。
redis_data = /opt/redis/data
# Redis PID 目录；用于查找服务 PID 和系统参数。
redis_pid = /opt/redis/pid
# Linux 运行用户兼容配置（Redis ACL 登录用户名固定使用 default）。
# Redis 登录用户名；Redis 无 ACL 用户时使用 default，保留此项用于兼容配置。
redis_user = redis
# Redis 登录密码；请在现场私有配置中填写，勿提交真实密码。
redis_passwd = CHANGE_ME
# Redis 版本基线；用于将运行版本与期望版本比较。
redis_version = 7.4.2
# Redis 部署模式；可选 cluster、sentinel 或 standalone，决定巡检路径。
redis_mode = cluster
# Redis 连接地址；优先使用运行配置发现，此值作为连接兜底。
redis_host = 127.0.0.1
# Redis 普通服务端口；用于 standalone/sentinel 模式连接和端口检查。
redis_port = 6379
# Redis 从节点端口；用于复制模式端口检查。
redis_replica_port = 16379
# Redis Sentinel 端口；用于 Sentinel 模式健康检查。
redis_sentinel_port = 26379
# Redis Cluster 数据端口；用于 Cluster 模式健康检查。
redis_cluster_port = 7000
# Redis Cluster Bus 端口；用于 Cluster 节点间通信检查。
redis_cluster_bus_port = 17000
# 期望的 Redis Cluster 主节点数；用于集群规模判定。
redis_expected_masters = 3
# 期望的 Redis Cluster 副本数；用于复制拓扑判定。
redis_expected_replicas = 3
# 期望的 Redis Sentinel 数量；用于 Sentinel 集群规模判定。
redis_expected_sentinels = 3

# RocketMQ：默认值来自 Rocketmq 运维巡检手册 v1.0。
# RocketMQ 安装主目录；用于派生程序、配置和日志路径。
rocketmq_home = /opt/rocketmq
# RocketMQ 使用的 JDK 目录；用于检查 Java 运行环境。
rocketmq_jdk_home = /opt/jdk1.8.0_421
# RocketMQ 运行用户的 shell 配置文件；用于读取运行环境变量。
rocketmq_profile = /home/rocketmq/.bash_profile
# RocketMQ 部署模式；用于决定集群、Controller 和 Broker 检查方式。
rocketmq_mode = cluster
# RocketMQ 配置目录；用于查找 NameServer、Broker 配置文件。
rocketmq_conf = /opt/rocketmq/conf
# RocketMQ NameServer 程序路径；用于识别安装位置和管理命令目录。
rocketmq_bin = /opt/rocketmq/bin/mqnamesrv
# RocketMQ 日志目录；用于统计关键错误和日志留存。
rocketmq_log = /opt/rabbitmq/logs
# RocketMQ Broker 配置文件路径；用于读取节点、NameServer 和 Controller 地址。
rocketmq_broker_conf = /opt/rocketmq/conf/broker.conf
# RocketMQ NameServer 配置文件路径；用于检查 NameServer 配置。
rocketmq_namesrv_conf = /opt/rocketmq/conf/namesrv.properties
# RocketMQ NameServer 端口；用于核心端口检查。
rocketmq_namesrv_port = 9876
# RocketMQ Controller 端口；用于 Controller 端口检查。
rocketmq_controller_port = 9877
# RocketMQ Broker 客户端端口；用于核心端口检查。
rocketmq_broker_port = 10911
# RocketMQ Broker 主从复制端口；用于高可用通信检查。
rocketmq_broker_ha_port = 10912
# RocketMQ NameServer 地址；优先从 Broker 配置提取，此值作为兜底。
rocketmq_namesrv_addr = 127.0.0.1:9876
# RocketMQ Controller 地址；优先从 Broker 配置提取，此值作为兜底。
rocketmq_controller_addr = 127.0.0.1:9877
# RocketMQ Broker 名称；用于匹配 Broker 运行状态和集群视图。
rocketmq_broker = broker-a
# 期望的 RocketMQ 集群节点数；用于 Broker 注册判定。
rocketmq_expected_nodes = 3
# 期望同步副本数；用于 Controller 同步集合判定。
rocketmq_expected_sync_replicas = 2
# RocketMQ 日志保留天数；用于日志轮转和历史文件检查。
rocketmq_old_log_days = 30

# Tomcat：默认值来自 Tomcat 运维巡检手册 v1.0。
# Tomcat 安装主目录；用于派生配置、程序和日志路径。
tomcat_home = /opt/tomcat
# Tomcat 配置目录；用于读取 server.xml 和安全配置。
tomcat_conf = /opt/tomcat/conf
# Tomcat 二进制目录；用于查找启动脚本和运行文件。
tomcat_bin = /opt/tomcat/bin
# Tomcat 日志目录；用于统计启动错误、访问错误和日志留存。
tomcat_log = /opt/tomcat/logs
# Tomcat HTTP 端口；用于本地 HTTP 健康和端口检查。
tomcat_port = 8080
# Tomcat HTTP 绑定地址；用于本地 HTTP 健康检查。
tomcat_address = 192.168.0.101
# Tomcat HTTPS 端口；启用 HTTPS 检查时使用。
tomcat_https_port = 8443
# Tomcat Shutdown 端口；用于端口隔离检查，不执行关闭操作。
tomcat_shutdown_port = 8005
# 是否启用 Tomcat HTTPS 检查；true 启用，false 跳过 HTTPS 探测。
tomcat_https_enabled = false
# Tomcat 运行用户；用于检查进程和文件归属。
tomcat_user = tomcat
# Tomcat 使用的 Java 目录；用于检查 Java 环境和启动参数。
tomcat_java_home = /opt/jre1.8.0_421
# Tomcat 版本基线；用于将运行版本与期望版本比较。
tomcat_version = 9.0.110
# Tomcat 应用目录；用于检查默认应用是否清理。
tomcat_webapps = /opt/tomcat/webapps
# Tomcat 日志保留天数；用于检查历史日志轮转情况。
tomcat_old_log_days = 1
# Tomcat 大日志阈值；用于检查单个日志文件是否异常增长。
tomcat_large_log_size = 1G
