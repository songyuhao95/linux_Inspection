      CRIT: { rule: null, rule_id: null, reason: missing, note: "MR §6：（文档未定义）" }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "持续>核数 → 缺失 → UNKNOWN" }
  local.memory.available_percent:
    name: 可用内存百分比
    source_anchor: "9 份巡检手册 P0 内存行（ES T5R4、Kafka T5R8、Mysql T5R8、Nacos T5R8、Rabbitmq T5R9、Rocketmq T5R9、Nginx T5R9、Tomcat T5R7、Redis T5R7）；巡检手册 sha256[:8]: ES=bb8ff97e, Kafka=0772f967, Mysql=67ae309b, Nacos=43cad170, Nginx=72b0834d, Rabbitmq=a6e0861f, Redis=e5cf1a4d, Rocketmq=9d70e22c, Tomcat=49aa5707"
