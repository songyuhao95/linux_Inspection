      CRIT: { rule: ">90% 且伴随业务证据", rule_id: "linux-common-p0-v1.cpu.utilization.crit", reason: null, note: null }
      UNKNOWN: { rule: null, rule_id: null, reason: none, note: "Nginx/Tomcat 差异 C2" }
  local.cpu.load_1m:
    name: 系统负载
    source_anchor: "9 份巡检手册 P0 CPU 行正常标准“load_1m 不持续高于 CPU 核数”（ES T5R3、Kafka T5R7、Nacos T5R7、Rabbitmq T5R8、Redis T5R9、Rocketmq T5R8）；巡检手册 sha256[:8]: ES=bb8ff97e, Kafka=0772f967, Mysql=67ae309b, Nacos=43cad170, Nginx=72b0834d, Rabbitmq=a6e0861f, Redis=e5cf1a4d, Rocketmq=9d70e22c, Tomcat=49aa5707"
    boundaries:
