      CRIT: { rule: null, rule_id: null, reason: conflict, note: "MR §6：（文档未定义）" }
      UNKNOWN: { rule: null, rule_id: null, reason: conflict, note: ">0 → 冲突 C3 → UNKNOWN" }
  local.filesystem.used_percent:
    name: 磁盘使用率
    source_anchor: "9 份巡检手册 P0 磁盘行（ES T5R5、Kafka T5R9、Mysql T5R9、Nacos T5R9、Rabbitmq T5R10、Redis T5R10、Rocketmq T5R10、Nginx T5R10、Tomcat T5R8）；巡检手册 sha256[:8]: ES=bb8ff97e, Kafka=0772f967, Mysql=67ae309b, Nacos=43cad170, Nginx=72b0834d, Rabbitmq=a6e0861f, Redis=e5cf1a4d, Rocketmq=9d70e22c, Tomcat=49aa5707"
