# Nginx 文档基线阈值（nginx-p0-v1）
#
# 来源：《安徽农金Nginx、Keepalived运维巡检手册v1.0.docx》（P0 必看指标 /
# P1 关注指标表；Nginx 巡检手册 sha256[:8]=72b0834d）。
# 本文件是手册 P0/P1 指标表「正常标准 / 异常判断 / 处理建议」的逐项转写：
# 每条指标含 OK/WARN/CRIT/UNKNOWN 边界、source_anchor 与版本标识 nginx-p0-v1。
#
# 转写规则（与 MR §3 一致）：
#   - 边界文本逐字转录手册单元格；禁止发明或调整阈值；
#   - 单元格为“（文档未定义）”的边界 → rule: null（未定义，不参与判定）；
#   - 无法判定的边界按 UNKNOWN 语义标注（reason: missing|conflict|none + 原文 note）。
schema: threshold-baseline-v1
version: nginx-p0-v1
scope: nginx-p0-v1
source_doc: "安徽农金Nginx、Keepalived运维巡检手册v1.0.docx（P0/P1 指标表）"
metrics:
  local.nginx.process.present:
    name: Nginx 进程存在性
    source_anchor: "P0 指标表「Nginx本节点服务」行（pgrep -fa 'nginx: master|nginx: worker|/usr/sbin/nginx|/opt/nginx/sbin/nginx'）；安徽农金Nginx、Keepalived运维巡检手册v1.0.docx"
    boundaries:
      OK: { rule: "进程存在", rule_id: "nginx-p0-v1.nginx.process.present.ok", reason: null, note: null }
      WARN: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      CRIT: { rule: "进程不存在（未运行/故障）", rule_id: "nginx-p0-v1.nginx.process.present.crit", reason: null, note: null }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "无权限或 pgrep 不可用" }
  local.nginx.config.valid:
    name: Nginx 配置有效性
    source_anchor: "P0 指标表「Nginx配置有效性」行（/usr/sbin/nginx -e error.log -c nginx.conf -t；返回 syntax is ok 和 test is successful）；安徽农金Nginx、Keepalived运维巡检手册v1.0.docx"
    boundaries:
      OK: { rule: "syntax is ok + test is successful", rule_id: "nginx-p0-v1.nginx.config.valid.ok", reason: null, note: null }
      WARN: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      CRIT: { rule: "语法失败/文件缺失/端口冲突/权限错误", rule_id: "nginx-p0-v1.nginx.config.valid.crit", reason: null, note: null }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "nginx 可执行文件不可用或无权限读取配置" }
  local.nginx.port.listening:
    name: Nginx 端口监听与本地访问
    source_anchor: "P0 指标表「Nginx端口与本地访问」行（ss -tlnp | grep ':8010'；curl -sS -I --connect-timeout 3 http://127.0.0.1:8010/）；安徽农金Nginx、Keepalived运维巡检手册v1.0.docx"
    boundaries:
      OK: { rule: "端口 LISTEN 且本地 HTTP 返回可解释状态（200/302/401/403）", rule_id: "nginx-p0-v1.nginx.port.listening.ok", reason: null, note: null }
      WARN: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      CRIT: { rule: "端口不监听/连接超时/拒绝连接/持续 5xx", rule_id: "nginx-p0-v1.nginx.port.listening.crit", reason: null, note: null }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "ss/curl 不可用" }
  local.nginx.error_log.key_evidence:
    name: Nginx 关键日志
    source_anchor: "P0 指标表「关键日志」行（tail -n 100 error.log；egrep -i 'emerg|alert|crit|error|permission denied|bind(|connect() failed|upstream timed out'）；安徽农金Nginx、Keepalived运维巡检手册v1.0.docx"
    boundaries:
      OK: { rule: "无 emerg/alert/crit/error 命中", rule_id: "nginx-p0-v1.nginx.error_log.key_evidence.ok", reason: null, note: null }
      WARN: { rule: "命中关键错误（记录时间点与错误内容，优先处理）", rule_id: "nginx-p0-v1.nginx.error_log.key_evidence.warn", reason: null, note: null }
      CRIT: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "日志不可读" }
  local.nginx.connections.status:
    name: Nginx 连接状态（stub_status）
    source_anchor: "P1 指标表「Nginx连接状态」行（curl -sS --connect-timeout 3 http://127.0.0.1:8010/nginx_status）；安徽农金Nginx、Keepalived运维巡检手册v1.0.docx"
    boundaries:
      OK: { rule: "stub_status 开启且返回 Active connections/Reading/Writing/Waiting", rule_id: "nginx-p0-v1.nginx.connections.status.ok", reason: null, note: null }
      WARN: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      CRIT: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "未开启 stub_status（记录为未配置）/URL 不可访问" }
  local.nginx.access_log.status_codes:
    name: 访问日志状态码
    source_anchor: "P1 指标表「访问日志状态码」行（tail -n 1000 access.log；5xx 无持续增长）；安徽农金Nginx、Keepalived运维巡检手册v1.0.docx"
    boundaries:
      OK: { rule: "5xx=0（2xx/3xx 为主）", rule_id: "nginx-p0-v1.nginx.access_log.status_codes.ok", reason: null, note: null }
      WARN: { rule: "5xx>0（记录 URL/来源 IP/状态码/时间段，关联 error.log 处理）", rule_id: "nginx-p0-v1.nginx.access_log.status_codes.warn", reason: null, note: null }
      CRIT: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "访问日志不可读" }
  local.nginx.config.baseline:
    name: Nginx 配置基线
    source_anchor: "P1 指标表「Nginx配置基线」行（grep -E 'worker_processes|worker_rlimit_nofile|worker_connections|use epoll|multi_accept|keepalive_timeout|client_max_body_size|limit_req|limit_conn' nginx.conf）；安徽农金Nginx、Keepalived运维巡检手册v1.0.docx"
    boundaries:
      OK: { rule: "核心指令存在（worker_processes/worker_connections/keepalive_timeout 等）", rule_id: "nginx-p0-v1.nginx.config.baseline.ok", reason: null, note: null }
      WARN: { rule: "配置漂移/核心指令缺失（记录差异与变更依据）", rule_id: "nginx-p0-v1.nginx.config.baseline.warn", reason: null, note: null }
      CRIT: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "配置文件不可读" }
  local.nginx.security.baseline:
    name: 安全配置基线
    source_anchor: "P1 指标表「安全配置基线」行（grep -E 'server_tokens|autoindex|X-Frame-Options|X-Content-Type-Options|Content-Security-Policy|request_method' nginx.conf）；安徽农金Nginx、Keepalived运维巡检手册v1.0.docx"
    boundaries:
      OK: { rule: "server_tokens off 且 autoindex off", rule_id: "nginx-p0-v1.nginx.security.baseline.ok", reason: null, note: null }
      WARN: { rule: "安全配置缺失（记录风险，按安全加固要求补齐）", rule_id: "nginx-p0-v1.nginx.security.baseline.warn", reason: null, note: null }
      CRIT: { rule: null, rule_id: null, reason: missing, note: "（文档未定义）" }
      UNKNOWN: { rule: null, rule_id: null, reason: missing, note: "配置文件不可读" }
